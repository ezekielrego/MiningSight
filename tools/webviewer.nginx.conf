# Isolated provider viewer origin; install in /etc/nginx/conf.d/.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tunnelsight.applications.co.zw;
    ssl_certificate /etc/letsencrypt/live/tunnelsight-viewer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnelsight-viewer/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
