plugins {
    id 'com.android.application'
}

def djiAppKey = project.findProperty('DJI_APP_KEY') ?: 'REPLACE_WITH_DJI_APP_KEY'

android {
    namespace 'co.techinn.miningsight.bridge'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'co.techinn.miningsight.bridge'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        multiDexEnabled true
        manifestPlaceholders = [DJI_APP_KEY: djiAppKey]
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/rxjava.properties']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.core:core:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.dji:dji-sdk:4.18'
    compileOnly 'com.dji:dji-sdk-provided:4.18'
}
